name: ConstruCalc APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: construcalc-apk-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate temporary signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/construcalc-test-release.jks" \
            -storepass "ConstruCalcTemp2026!" \
            -keypass "ConstruCalcTemp2026!" \
            -alias construcalc -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=ConstruCalc, OU=Release, O=Lay, L=Luanda, ST=Luanda, C=AO"
      - name: Build signed Release APK
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/construcalc-test-release.jks" \
            -Pandroid.injected.signing.store.password="ConstruCalcTemp2026!" \
            -Pandroid.injected.signing.key.alias="construcalc" \
            -Pandroid.injected.signing.key.password="ConstruCalcTemp2026!"
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ConstruCalc-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Clean temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/construcalc-test-release.jks"
